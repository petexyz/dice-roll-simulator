<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dice Roller</title>
<style>
  :root {
    --bg: #f6f7f9; --surface: #ffffff; --ink: #1c2330; --ink-2: #566072; --line: #dfe3ea;
    --bar: #2f6fde; --bar-hover: #1f55b8; --accent: #2f6fde;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b; --surface: #1b2029; --ink: #e8ebf1; --ink-2: #9aa4b5; --line: #2e3542;
      --bar: #6ea0f5; --bar-hover: #9dc0fa; --accent: #6ea0f5;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 900px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { margin: 0 0 4px; font-size: 1.6rem; }
  h2 { margin: 0 0 12px; font-size: 1.05rem; }
  p.sub { margin: 0 0 20px; color: var(--ink-2); }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    padding: 16px; margin-bottom: 16px; }
  form { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; }
  label { display: grid; gap: 4px; font-size: .85rem; color: var(--ink-2); }
  input[type=number] { width: 9rem; padding: 8px 10px; font: inherit; color: var(--ink);
    background: var(--bg); border: 1px solid var(--line); border-radius: 8px; }
  button { padding: 9px 18px; font: inherit; font-weight: 600; cursor: pointer; border-radius: 8px;
    border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  @media (prefers-color-scheme: dark) { button.primary { color: #10141b; } }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .error { color: #c0392b; font-size: .9rem; margin: 10px 0 0; min-height: 1.2em; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; }
  .stat { background: var(--bg); border-radius: 8px; padding: 10px 12px; }
  .stat b { display: block; font-size: 1.35rem; font-variant-numeric: tabular-nums; }
  .stat span { font-size: .8rem; color: var(--ink-2); }
  .legend { display: flex; gap: 16px; font-size: .85rem; color: var(--ink-2); margin-bottom: 4px; }
  .legend i { display: inline-block; vertical-align: middle; margin-right: 6px; }
  .legend .k-bar { width: 12px; height: 12px; border-radius: 3px; background: var(--bar); }
  .legend .k-exp { width: 14px; height: 2px; background: var(--ink); }
  #chartWrap { position: relative; }
  svg { display: block; width: 100%; }
  svg text { fill: var(--ink-2); font-size: 11px; font-variant-numeric: tabular-nums; }
  .grid { stroke: var(--line); stroke-width: 1; }
  .bar { fill: var(--bar); }
  .hit { fill: transparent; }
  .hit:hover + .bar, .bar.on { fill: var(--bar-hover); }
  .exp { stroke: var(--ink); stroke-width: 2; stroke-linecap: round; }
  #tip { position: absolute; pointer-events: none; display: none; z-index: 2; white-space: nowrap;
    background: var(--ink); color: var(--surface); font-size: .8rem; line-height: 1.4;
    padding: 6px 9px; border-radius: 6px; transform: translate(-50%, -100%); }
  .rolls { display: flex; flex-wrap: wrap; gap: 8px; max-height: 260px; overflow: auto; }
  .roll { background: var(--bg); border-radius: 8px; padding: 2px 8px; font-size: .9rem;
    font-variant-numeric: tabular-nums; }
  .roll .faces { font-size: 1.3rem; line-height: 1; letter-spacing: 1px; }
  .roll .sum { color: var(--ink-2); margin-left: 4px; }
  details summary { cursor: pointer; font-weight: 600; }
  table { border-collapse: collapse; width: 100%; margin-top: 12px; font-variant-numeric: tabular-nums; }
  th, td { text-align: right; padding: 4px 10px; border-bottom: 1px solid var(--line); font-size: .9rem; }
  th { color: var(--ink-2); font-weight: 600; }
  .note { color: var(--ink-2); font-size: .85rem; margin: 8px 0 0; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>Dice Roller</h1>
  <p class="sub">Roll a handful of six-sided dice as many times as you like and see how the totals stack up.</p>

  <section class="card">
    <form id="form" novalidate>
      <label>Number of dice
        <input id="dice" type="number" min="1" max="50" step="1" value="2" inputmode="numeric">
      </label>
      <label>Number of rolls
        <input id="rolls" type="number" min="1" max="1000000" step="1" value="100" inputmode="numeric">
      </label>
      <button class="primary" type="submit">Roll</button>
      <button type="button" id="clear">Clear</button>
    </form>
    <p class="error" id="error" role="alert"></p>
  </section>

  <div id="results" hidden>
    <section class="card">
      <div class="stats" id="stats"></div>
    </section>

    <section class="card">
      <h2 id="chartTitle">Totals</h2>
      <div class="legend">
        <span><i class="k-bar"></i>Rolled</span>
        <span><i class="k-exp"></i>Expected on average</span>
      </div>
      <div id="chartWrap">
        <svg id="chart" role="img" aria-labelledby="chartTitle"></svg>
        <div id="tip"></div>
      </div>
    </section>

    <section class="card">
      <h2 id="rollsTitle">Individual rolls</h2>
      <div class="rolls" id="rollList"></div>
      <p class="note" id="rollNote"></p>
    </section>

    <section class="card">
      <details>
        <summary>Table of totals</summary>
        <table>
          <thead><tr><th>Total</th><th>Count</th><th>Rolled %</th><th>Expected %</th></tr></thead>
          <tbody id="tbody"></tbody>
        </table>
      </details>
    </section>
  </div>
</main>

<script>
(() => {
  const MAX_DICE = 50, MAX_ROLLS = 1000000, SHOWN = 200;
  const FACES = ['', '⚀', '⚁', '⚂', '⚃', '⚄', '⚅'];
  const $ = id => document.getElementById(id);
  const fmt = n => n.toLocaleString();
  const pct = x => (x * 100).toFixed(x < 0.0995 ? 2 : 1) + '%';
  let state = null;

  // Exact probability of each total for n dice; index 0 is total n.
  function expected(n) {
    let p = [1];
    for (let d = 0; d < n; d++) {
      const q = new Array(p.length + 5).fill(0);
      for (let i = 0; i < p.length; i++) for (let f = 0; f < 6; f++) q[i + f] += p[i] / 6;
      p = q;
    }
    return p;
  }

  function readInt(el, name, max) {
    const v = Number(el.value);
    if (!Number.isInteger(v) || v < 1 || v > max)
      throw new Error(`${name} must be a whole number from 1 to ${fmt(max)}.`);
    return v;
  }

  function roll(n, times) {
    const counts = new Array(5 * n + 1).fill(0);
    const sample = [];
    let total = 0, lo = Infinity, hi = -Infinity;
    for (let r = 0; r < times; r++) {
      let sum = 0;
      const faces = r < SHOWN ? [] : null;
      for (let d = 0; d < n; d++) {
        const f = 1 + Math.floor(Math.random() * 6);
        sum += f;
        if (faces) faces.push(f);
      }
      if (faces) sample.push({ faces, sum });
      counts[sum - n]++;
      total += sum;
      if (sum < lo) lo = sum;
      if (sum > hi) hi = sum;
    }
    const top = Math.max(...counts);
    return { n, times, counts, sample, mean: total / times, lo, hi,
      mode: counts.indexOf(top) + n, exp: expected(n) };
  }

  function renderStats(s) {
    const items = [
      [fmt(s.times), s.times === 1 ? 'roll' : 'rolls'],
      [s.mean.toFixed(2), `average total (expected ${(3.5 * s.n).toFixed(1)})`],
      [s.mode, 'most common total'],
      [s.lo, 'lowest total'],
      [s.hi, 'highest total'],
    ];
    $('stats').innerHTML = items.map(([v, l]) => `<div class="stat"><b>${v}</b><span>${l}</span></div>`).join('');
  }

  function niceMax(v) {
    if (v <= 5) return Math.max(1, Math.ceil(v));
    const mag = Math.pow(10, Math.floor(Math.log10(v)));
    for (const m of [1, 2, 2.5, 5, 10]) if (m * mag >= v) return m * mag;
  }

  function renderChart(s) {
    const svg = $('chart');
    const W = Math.max(280, $('chartWrap').clientWidth), H = 300;
    const m = { t: 12, r: 8, b: 26, l: 44 };
    const pw = W - m.l - m.r, ph = H - m.t - m.b;
    const k = s.counts.length;
    const expCounts = s.exp.map(p => p * s.times);
    const yMax = niceMax(Math.max(...s.counts, ...expCounts));
    const y = v => m.t + ph - (v / yMax) * ph;
    const step = pw / k;
    const gap = step > 6 ? 2 : step > 3 ? 1 : 0;
    const bw = Math.max(1, step - gap);
    let out = '';

    for (let i = 0; i <= 4; i++) {
      const v = yMax * i / 4, yy = y(v);
      if (yMax < 4 && !Number.isInteger(v)) continue;
      out += `<line class="grid" x1="${m.l}" x2="${W - m.r}" y1="${yy}" y2="${yy}"/>` +
        `<text x="${m.l - 6}" y="${yy + 4}" text-anchor="end">${fmt(Math.round(v * 10) / 10)}</text>`;
    }

    const every = Math.max(1, Math.ceil(k / Math.floor(pw / 30)));
    for (let i = 0; i < k; i++) {
      const x = m.l + i * step + gap / 2, c = s.counts[i];
      const h = c ? Math.max(1, (c / yMax) * ph) : 0;
      const r = Math.min(4, bw / 2, h);
      out += `<rect class="hit" data-i="${i}" x="${m.l + i * step}" y="${m.t}" width="${step}" height="${ph}"/>`;
      out += `<path class="bar" d="M${x},${m.t + ph}v${-(h - r)}q0,${-r} ${r},${-r}h${bw - 2 * r}q${r},0 ${r},${r}v${h - r}z"/>`;
      const ey = y(expCounts[i]);
      out += `<line class="exp" x1="${x + 1}" x2="${x + bw - 1}" y1="${ey}" y2="${ey}" pointer-events="none"/>`;
      if (i % every === 0)
        out += `<text x="${x + bw / 2}" y="${H - 8}" text-anchor="middle">${i + s.n}</text>`;
    }
    svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
    svg.setAttribute('height', H);
    svg.innerHTML = out;
    $('chartTitle').textContent =
      `Totals from ${fmt(s.times)} ${s.times === 1 ? 'roll' : 'rolls'} of ${s.n} ${s.n === 1 ? 'die' : 'dice'}`;
  }

  function renderRolls(s) {
    const big = s.n > 12;
    $('rollList').innerHTML = s.sample.map(r =>
      `<span class="roll">${big ? r.faces.join(' ') : `<span class="faces">${r.faces.map(f => FACES[f]).join('')}</span>`}` +
      `<span class="sum">= ${r.sum}</span></span>`).join('');
    $('rollNote').textContent = s.times > SHOWN
      ? `Showing the first ${SHOWN} of ${fmt(s.times)} rolls. Every roll is counted in the chart and table.` : '';
  }

  function renderTable(s) {
    $('tbody').innerHTML = s.counts.map((c, i) =>
      `<tr><td>${i + s.n}</td><td>${fmt(c)}</td><td>${pct(c / s.times)}</td><td>${pct(s.exp[i])}</td></tr>`).join('');
  }

  const tip = $('tip');
  $('chart').addEventListener('pointermove', e => {
    const t = e.target.closest('.hit');
    if (!t || !state) return hideTip();
    const i = +t.dataset.i, c = state.counts[i];
    const wrap = $('chartWrap').getBoundingClientRect(), box = t.getBoundingClientRect();
    tip.innerHTML = `<b>Total ${i + state.n}</b><br>Rolled ${fmt(c)} time${c === 1 ? '' : 's'} (${pct(c / state.times)})` +
      `<br>Expected ${pct(state.exp[i])}`;
    tip.style.display = 'block';
    const half = tip.offsetWidth / 2;
    const cx = box.left - wrap.left + box.width / 2;
    tip.style.left = Math.min(Math.max(cx, half), wrap.width - half) + 'px';
    tip.style.top = Math.max(e.clientY - wrap.top - 12, tip.offsetHeight) + 'px';
  });
  const hideTip = () => { tip.style.display = 'none'; };
  $('chart').addEventListener('pointerleave', hideTip);

  $('form').addEventListener('submit', e => {
    e.preventDefault();
    $('error').textContent = '';
    try {
      const n = readInt($('dice'), 'Number of dice', MAX_DICE);
      const times = readInt($('rolls'), 'Number of rolls', MAX_ROLLS);
      state = roll(n, times);
    } catch (err) {
      $('error').textContent = err.message;
      return;
    }
    $('results').hidden = false;
    renderStats(state); renderChart(state); renderRolls(state); renderTable(state);
  });

  $('clear').addEventListener('click', () => {
    state = null;
    $('results').hidden = true;
    $('error').textContent = '';
    hideTip();
  });

  window.addEventListener('resize', () => { if (state) renderChart(state); });
})();
</script>
</body>
</html>
